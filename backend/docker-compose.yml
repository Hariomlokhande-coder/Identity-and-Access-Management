services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iam
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: iam
    ports: ["15432:5432"]
    volumes: ["iam-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam -d iam"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["iam-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  frontend:
    profiles: ["console"]
    image: node:22-alpine
    working_dir: /app
    # API calls run in the browser and use the Spring Boot server on localhost:8081.
    command: ["sh", "-c", "npm ci --legacy-peer-deps && npm start -- --host 0.0.0.0 --poll 2000"]
    ports: ["127.0.0.1:3001:3001"]
    volumes:
      - ../frontend:/app:ro
      - type: volume
        source: iam-frontend-modules
        target: /app/node_modules
        volume:
          nocopy: true
      - type: volume
        source: iam-frontend-cache
        target: /app/.angular
        volume:
          nocopy: true

volumes:
  iam-pg:
  iam-redis:
  iam-frontend-modules:
  iam-frontend-cache:
